name: CI testes unitarios contratocommand

on:
  push:
    paths:
      - "apps/contratocommand/**"
  pull_request:
    paths:
      - "apps/contratocommand/**"

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/contratocommand/pom.xml
          # GitHub Packages exige autenticacao ate para leitura (dependencia srportto-commons-java)
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Rodar testes unitarios
        working-directory: apps/contratocommand
        run: mvn -B test -Dtest='!*IntegrationTest'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
