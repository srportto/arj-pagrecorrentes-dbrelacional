# Ponto de entrada unico do ambiente local: sobe banco, mensageria e as cinco aplicacoes
# com um unico comando, sem exigir conhecimento tacito da ordem de subida.
#
# Este arquivo e PURAMENTE composicao - nao declara servico, rede nem volume proprio.
# Cada compose referenciado abaixo continua completo e valido por si (ver README de
# cada infra/local/* para subir isolado). Ver a change unificar-orquestracao-docker-local
# (D1) para o racional de usar include: em vez de fundir tudo num arquivo so.
include:
  - infra/local/postgres/postgres-db-v18.yml
  - infra/local/floci/compose.yaml
  - infra/local/kafka/compose.yaml
  - infra/local/redis/compose.yaml
  # O segundo arquivo so declara depends_on (service_healthy) dos 5 apps contra a infra acima --
  # fica fora de apps/docker-compose.yml para nao quebrar a subida standalone (Opcao C do
  # README), que nao conhece os servicos de infra/local/*. Ver apps/docker-compose.depends-on.yml.
  - path:
      - apps/docker-compose.yml
      - apps/docker-compose.depends-on.yml
