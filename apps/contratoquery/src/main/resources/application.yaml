spring:
    application:
        name: contratoquery
    profiles:
        default: local
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
        username: ${DB_USER_NAME}
        password: ${DB_PASSWORD}
        hikari:
            driver-class-name: org.postgresql.Driver
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
            idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
            max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
            transaction-isolation: ${DB_TRANSACTION_ISOLATION:TRANSACTION_READ_COMMITTED}
            read-only: ${DB_READ_ONLY:true}
            # Elimina o replanejamento por chamada nas consultas que varrem as 989 particoes de
            # `autorizacoes` sem podar (a listagem filtra por conta, nao pela chave de particao).
            # Roda uma vez por CONEXAO FISICA (nao por chamada) -- ver
            # PlanCacheModeHikariIntegrationTest, que prova que vale para todas as conexoes do
            # pool, nao so a primeira. Detalhe do achado empirico em
            # openspec/changes/reduzir-custo-planejamento-consultas/design.md.
            connection-init-sql: SET plan_cache_mode = 'force_generic_plan'
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false
        open-in-view: false

management:
    endpoints:
        web:
            exposure:
                include: health

server:
    port: 8081
    shutdown: graceful

contratoquery:
    consulta:
        # Nivel 3 da cascata de localizacao do GET /api/autorizacoes/{id}: procura nas demais
        # particoes quentes quando a autorizacao nao esta nem na particao derivada do id nem na
        # faixa de expurgo. Encontrar algo aqui e anomalia (invariante de localizacao violado),
        # nao caminho normal -- por isso nasce habilitado, para que a anomalia apareca.
        #
        # A justificativa de CUSTO perdeu forca depois da adocao de plan_cache_mode=force_generic_plan
        # (ver connection-init-sql acima): o pior caso da cascata (id inexistente, 888 particoes)
        # caiu de ~44ms para ~7ms em nivel de consulta (medido em
        # openspec/changes/reduzir-custo-planejamento-consultas/design.md). A flag continua
        # existindo pelo motivo de DIAGNOSTICO -- desligar N3 se ele nunca acertar na pratica --
        # nao mais como mitigacao de risco operacional de CPU.
        busca-em-particoes-inesperadas: ${CONSULTA_BUSCA_PARTICOES_INESPERADAS:true}