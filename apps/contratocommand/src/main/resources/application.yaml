spring:
    application:
        name: contratocommand
    profiles:
        default: local
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
        username: ${DB_USER_NAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
            idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
            max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
            transaction-isolation: ${DB_TRANSACTION_ISOLATION:TRANSACTION_READ_COMMITTED}
            read-only: ${DB_READ_ONLY:false}
            # Mesma justificativa do contratoquery: elimina o replanejamento por chamada em
            # consultas sem poda de particao (ex.: findByIdAutorizacao). As consultas ja podadas
            # para 1 particao (existsBy..., moverParaParticao) pagam uma regressao irrelevante
            # (sempre sub-milissegundo) -- ver openspec/changes/reduzir-custo-planejamento-consultas/design.md.
            connection-init-sql: SET plan_cache_mode = 'force_generic_plan'
    jpa:
        hibernate:
            ddl-auto: none
#        properties:
#            hibernate:
#                dialect: org.hibernate.dialect.PostgreSQLDialect
#               -> nao precisa especificar o dialeto nas versoes mais recentes do jpa
        open-in-view: false

management:
    endpoints:
        web:
            exposure:
                include: health

server:
    shutdown: graceful

logging:
    structured:
        format:
            console: logstash