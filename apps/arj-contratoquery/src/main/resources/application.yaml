spring:
    application:
        name: contratoquery
    profiles:
        default: local
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
        username: ${DB_USER_NAME}
        password: ${DB_PASSWORD}
        hikari:
            driver-class-name: org.postgresql.Driver
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
            idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
            max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
            transaction-isolation: ${DB_TRANSACTION_ISOLATION:TRANSACTION_READ_COMMITTED}
            read-only: ${DB_READ_ONLY:true}
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false
        open-in-view: false

management:
    endpoints:
        web:
            exposure:
                include: health

server:
    port: 8081
    shutdown: graceful

contratoquery:
    consulta:
        # Nivel 3 da cascata de localizacao do GET /api/autorizacoes/{id}: procura nas demais
        # particoes quentes quando a autorizacao nao esta nem na particao derivada do id nem na
        # faixa de expurgo. Encontrar algo aqui e anomalia (invariante de localizacao violado),
        # nao caminho normal -- por isso nasce habilitado, para que a anomalia apareca.
        #
        # Desligue se o custo do caminho de "nao encontrado" incomodar: o pior caso da cascata e
        # o id INEXISTENTE, que percorre todos os niveis habilitados antes do 404. O custo e CPU
        # de planejamento sobre 888 particoes, nao I/O.
        busca-em-particoes-inesperadas: ${CONSULTA_BUSCA_PARTICOES_INESPERADAS:true}