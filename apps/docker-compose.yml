services:
  postgres:
    build:
      context: ../infra/local/postgres
    image: postgres18-kiq-extras-partman_cron_vector:1.0
    command: [
      "postgres",
      "-c", "shared_preload_libraries=pg_partman_bgw",
      "-c", "shared_preload_libraries=pg_cron",
      "-c", "cron.database_name=${DB_NAME:-db-csp-postgres}",
      ]
    environment:
      POSTGRES_DB: ${DB_NAME:-db-csp-postgres}
      POSTGRES_USER: ${DB_USER_NAME:-docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JTMQ9YxDkHfRQbX2}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-docker} -d ${DB_NAME:-db-csp-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  arj-contratocommand:
    build:
      context: ./arj-contratocommand
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:-JTMQ9YxDkHfRQbX2}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  arj-contratoquery:
    build:
      context: ./arj-contratoquery
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:-JTMQ9YxDkHfRQbX2}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
