services:
  contratocommand:
    build:
      context: ./contratocommand
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida - copie .env.example para .env}
      AWS_ENDPOINT: http://floci:4566
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:sns-estados-autorizacao
    networks:
      - default
      - postgres_default
      - floci_default
    restart: unless-stopped
    # Limite explicito de CPU/mem -- pre-requisito da capability de teste de carga
    # (change testes-de-carga-tps, design.md D5): sem isso, um teste local mede a
    # capacidade do Docker Desktop do executor, nao do servico. Valores sao ponto de
    # partida para calibracao, nao teto definitivo -- mesma convencao de
    # MAX_CONCURRENT_MESSAGES documentada em SqsListenerContainerFactoryConfig.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  contratoquery:
    build:
      context: ./contratoquery
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida - copie .env.example para .env}
    networks:
      - default
      - postgres_default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  autorizacaostatus-producer:
    build:
      context: ./autorizacaostatus-producer
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_AWS_ENDPOINT: http://floci:4566
      SQS_QUEUE_URL: http://floci:4566/000000000000/SQS-eventos-autorizacao
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - default
      - floci_default
      - kafka-eventos-autorizacao
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  eventos-consumer:
    build:
      context: ./eventos-consumer
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - default
      - kafka-eventos-autorizacao
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  temporiza-autorizacao:
    build:
      context: ./temporiza-autorizacao
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_AWS_ENDPOINT: http://floci:4566
      SQS_QUEUE_URL: http://floci:4566/000000000000/SQS-temporizacao-autorizacao
      SPRING_DATA_REDIS_HOST: valkey
      TEMPORIZACAO_COMMAND_BASE_URL: http://contratocommand:8080
    networks:
      - default
      - floci_default
      - redis_default
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  default: {}
  # As quatro redes abaixo sao "donas" nos composes de infra/local/* (nome literal
  # explicito la, ver D4) - aqui sao so referenciadas, sem "external: true": sob o
  # include: do compose de raiz, external:true fundido com a definicao nao-external do
  # lado dono faz o Compose recusar criar a rede (erro reproduzido empiricamente, ver
  # design.md D4). Referenciar pelo mesmo nome sem external funciona nos dois casos -
  # incluido via raiz (cria uma vez) e apps sozinho contra infra ja no ar (reanexa com
  # aviso, nao com erro).
  postgres_default:
    name: postgres_default
  floci_default:
    name: floci_default
  redis_default:
    name: redis_default
  kafka-eventos-autorizacao:
    name: kafka-eventos-autorizacao
