services:
  postgres:
    build:
      context: ../infra/local/postgres
    image: postgres18-kiq-extras-partman_cron_vector:1.0
    command: [
      "postgres",
      "-c", "shared_preload_libraries=pg_partman_bgw",
      "-c", "shared_preload_libraries=pg_cron",
      "-c", "cron.database_name=${DB_NAME:-db-csp-postgres}",
      ]
    environment:
      POSTGRES_DB: ${DB_NAME:-db-csp-postgres}
      POSTGRES_USER: ${DB_USER_NAME:-docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida - copie .env.example para .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-docker} -d ${DB_NAME:-db-csp-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  arj-contratocommand:
    build:
      context: ./arj-contratocommand
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida - copie .env.example para .env}
      AWS_ENDPOINT: http://floci:4566
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:sns-estados-autorizacao
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - postgres_default
      - floci_local
    restart: unless-stopped

  arj-contratoquery:
    build:
      context: ./arj-contratoquery
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-db-csp-postgres}
      DB_USER_NAME: ${DB_USER_NAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida - copie .env.example para .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - postgres_default
    restart: unless-stopped

  autorizacaostatus-producer:
    build:
      context: ./autorizacaostatus-producer
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_AWS_ENDPOINT: http://floci:4566
      SQS_QUEUE_URL: http://floci:4566/000000000000/SQS-eventos-autorizacao
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - default
      - floci_local
      - kafka-eventos-autorizacao
    restart: unless-stopped

  eventos-consumer:
    build:
      context: ./eventos-consumer
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - default
      - kafka-eventos-autorizacao
    restart: unless-stopped

  temporiza-autorizacao:
    build:
      context: ./temporiza-autorizacao
    ports:
      - "8084"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_AWS_ENDPOINT: http://floci:4566
      SQS_QUEUE_URL: http://floci:4566/000000000000/SQS-temporizacao-autorizacao
      SPRING_DATA_REDIS_HOST: valkey
      TEMPORIZACAO_COMMAND_BASE_URL: http://arj-contratocommand:8080
    networks:
      - default
      - floci_local
      - redis_default
    restart: unless-stopped

networks:
  default: {}
  postgres_default:
    external: true
  floci_local:
    external: true
    name: floci-aws-local_default
  redis_default:
    external: true
  kafka-eventos-autorizacao:
    external: true

volumes:
  pg_data:
