[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expurgo-particao"
version = "1.0.0"
description = "Lambda agendada que fecha o ring buffer de particoes de expurgo (900..999) da tabela autorizacoes"
# 3.13 e' a versao da imagem base da Lambda (public.ecr.aws/lambda/python:3.13, ver Dockerfile).
requires-python = ">=3.13"
dependencies = ["psycopg[binary]==3.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` no pythonpath deixa `from conftest import ...` funcionar por configuracao explicita,
# nao por acidente do sys.path do pytest.
pythonpath = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplificacoes.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py313"]
