services:
  floci:
    image: floci/floci:latest
    container_name: floci-arj
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=hybrid
    volumes:
      # Necessario para os servicos "real Docker" do Floci (ECS, ElastiCache, RDS, etc.)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci_default
    restart: unless-stopped
    # Ponto de partida para calibracao (change testes-de-carga-tps, design.md D5). Floci
    # roda ECS/Lambda como containers Docker reais (sibling, via docker.sock) e o registry
    # ECR emulado como container proprio -- memoria mais generosa que os apps Java simples.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  # Nome literal explicito (nao mais o default implicito derivado do diretorio do
  # projeto): apps/docker-compose.yml referencia esta rede pelo nome, e precisa que ele
  # fique estavel tanto subindo isolado quanto via include: do compose de raiz (ver
  # change unificar-orquestracao-docker-local, D4).
  floci_default:
    name: floci_default
