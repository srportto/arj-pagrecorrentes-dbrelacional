services:
  valkey:
    image: valkey/valkey:8
    container_name: valkey-temporiza-autorizacao
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redis_default
    restart: unless-stopped
    # Ponto de partida para calibracao (change testes-de-carga-tps, design.md D5).
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  # Nome literal explicito (nao mais o default implicito derivado do diretorio do
  # projeto): apps/docker-compose.yml referencia esta rede pelo nome, e precisa que ele
  # fique estavel tanto subindo isolado quanto via include: do compose de raiz (ver
  # change unificar-orquestracao-docker-local, D4).
  redis_default:
    name: redis_default

volumes:
  valkey_data:
