networks:
  kafka-eventos-autorizacao:
    name: kafka-eventos-autorizacao

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-eventos-autorizacao
    networks:
      - kafka-eventos-autorizacao
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    # Ponto de partida para calibracao (change testes-de-carga-tps, design.md D5).
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Cria eventos-autorizacao e eventos-autorizacao.DLT (3 particoes cada) e encerra.
  # auto.create.topics.enable fica desligado no broker: os topicos sao contrato
  # explicito, nao efeito colateral do primeiro produce. A DLT e destino do
  # DeadLetterPublishingRecoverer da eventos-consumer - sem ela criada aqui, a
  # publicacao na DLT falha, o offset nao avanca e a particao trava na mensagem
  # venenosa que a DLT deveria isolar.
  kafka-topic-init:
    image: confluentinc/cp-kafka:7.7.1
    networks:
      - kafka-eventos-autorizacao
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eventos-autorizacao --partitions 3 --replication-factor 1 &&
         kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eventos-autorizacao.DLT --partitions 3 --replication-factor 1"
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry-eventos-autorizacao
    networks:
      - kafka-eventos-autorizacao
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui-eventos-autorizacao
    networks:
      - kafka-eventos-autorizacao
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventos-autorizacao-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  kafka_data:
